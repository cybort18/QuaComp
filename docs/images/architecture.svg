<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #f0f6fc; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #8b949e; }
      .layer-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #58a6ff; letter-spacing: 0.08em; text-transform: uppercase; }
      .box { rx: 6px; ry: 6px; stroke-width: 1.2px; }
      .box-ingress { fill: #161b22; stroke: #30363d; }
      .box-workload { fill: #161b22; stroke: #388bfd; }
      .box-router { fill: #12283a; stroke: #58a6ff; }
      .box-engine { fill: #161b22; stroke: #7ee787; }
      .box-backend { fill: #161b22; stroke: #d29922; }
      .box-telemetry { fill: #161b22; stroke: #f0883e; }
      .box-export { fill: #161b22; stroke: #a371f7; }
      .box-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #c9d1d9; }
      .box-sub { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 10px; fill: #8b949e; }
      .arrow { stroke: #484f58; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .arrow-accent { stroke: #58a6ff; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead-accent); }
    </style>
    <marker id="arrowhead" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#484f58" />
    </marker>
    <marker id="arrowhead-accent" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#58a6ff" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="650" class="bg" />

  <!-- Header -->
  <text x="40" y="38" class="title">QuaComp 3-Paradigm System Architecture</text>
  <text x="40" y="58" class="subtitle">Multi-Paradigm Quantum-Classical Emulation Engine, Complexity Auto-Router &amp; Hardware Roofline Profiler</text>

  <!-- Layer 1: CLI & Ingress -->
  <text x="40" y="95" class="layer-title">Layer 1: CLI Ingress, Solver-Aware Memory Guards &amp; Baseline Registry</text>
  <rect x="40" y="105" width="280" height="68" class="box box-ingress" />
  <text x="55" y="130" class="box-text">CLI Parser &amp; Mixed-Precision Config</text>
  <text x="55" y="148" class="box-sub">cli/main.py (--sim-method, --precision fp64|fp32)</text>
  <text x="55" y="162" class="box-sub">Rich Terminal Dashboard &amp; UTF-8 Safe Guard</text>

  <rect x="340" y="105" width="280" height="68" class="box box-ingress" />
  <text x="355" y="130" class="box-text">Solver-Aware Pre-Flight Verifier</text>
  <text x="355" y="148" class="box-sub">src/profiler/memory.py, gpu.py (85% RAM/VRAM)</text>
  <text x="355" y="162" class="box-sub">O(2^n) Guard vs O(n^2)/O(n*chi^2) Bypass (100+Q)</text>

  <rect x="640" y="105" width="280" height="68" class="box box-ingress" />
  <text x="655" y="130" class="box-text">Hardware Registry &amp; Roofline Diff</text>
  <text x="655" y="148" class="box-sub">src/comparator/registry.py, differ.py</text>
  <text x="655" y="162" class="box-sub">DDR4 vs Unified Memory vs HBM3 Baselines</text>

  <!-- Connectors L1 to L2 -->
  <line x1="180" y1="173" x2="180" y2="212" class="arrow-accent" />
  <line x1="480" y1="173" x2="480" y2="212" class="arrow" />
  <line x1="780" y1="173" x2="780" y2="212" class="arrow-accent" />

  <!-- Layer 2: Workload Generation, AST Parsing & Complexity Auto-Router -->
  <text x="40" y="202" class="layer-title">Layer 2: Circuit Ingestion, AST Compilation &amp; Complexity Auto-Solver Router</text>
  <rect x="40" y="212" width="280" height="72" class="box box-workload" />
  <text x="55" y="237" class="box-text">Algorithmic &amp; Variational Circuits</text>
  <text x="55" y="255" class="box-sub">src/engine/circuits.py</text>
  <text x="55" y="269" class="box-sub">QFT, VQE, QAOA, Quantum Volume, Shallow/Deep</text>

  <rect x="340" y="212" width="280" height="72" class="box box-workload" />
  <text x="355" y="237" class="box-text">OpenQASM 2.0 Lexer &amp; AST Parser</text>
  <text x="355" y="255" class="box-sub">src/engine/parser.py</text>
  <text x="355" y="269" class="box-sub">Custom Gates, Broadcasts, 100-Qubit GHZ/Clifford</text>

  <rect x="640" y="212" width="280" height="72" class="box box-router" />
  <text x="655" y="237" class="box-text">Complexity Profiler &amp; Auto-Router</text>
  <text x="655" y="255" class="box-sub">src/engine/complexity.py (--sim-method auto)</text>
  <text x="655" y="269" class="box-sub">Entanglement Topology vs Quantum Magic Density</text>

  <!-- Connectors L2 to L3 -->
  <line x1="180" y1="284" x2="180" y2="325" class="arrow" />
  <line x1="480" y1="284" x2="480" y2="325" class="arrow-accent" />
  <line x1="780" y1="284" x2="780" y2="325" class="arrow-accent" />

  <!-- Layer 3: 3-Paradigm Simulation Engines -->
  <text x="40" y="315" class="layer-title">Layer 3: Multi-Paradigm Quantum Simulation Engines &amp; Stochastic Noise Trajectories</text>
  <rect x="40" y="325" width="280" height="84" class="box box-engine" />
  <text x="55" y="350" class="box-text">Statevector Engine O(2^n)</text>
  <text x="55" y="368" class="box-sub">src/engine/simulator.py, noise.py</text>
  <text x="55" y="382" class="box-sub">FP64 (16B) &amp; FP32 (8B, 50% RAM Reduction)</text>
  <text x="55" y="396" class="box-sub">MCWF Stochastic Jump Trajectories (&lt;= 30Q)</text>

  <rect x="340" y="325" width="280" height="84" class="box box-engine" />
  <text x="355" y="350" class="box-text">MPS Tensor Network O(n * chi^3)</text>
  <text x="355" y="368" class="box-sub">src/engine/mps.py (--mps, --max-bond-dim)</text>
  <text x="355" y="382" class="box-sub">1D Tensor Train + SWAP Network Routing</text>
  <text x="355" y="396" class="box-sub">SVD Truncation Fidelity &amp; Error Tracking</text>

  <rect x="640" y="325" width="280" height="84" class="box box-engine" />
  <text x="655" y="350" class="box-text">Stabilizer Tableau O(n^2)</text>
  <text x="655" y="368" class="box-sub">src/engine/stabilizer.py (--stabilizer)</text>
  <text x="655" y="382" class="box-sub">Aaronson-Gottesman CHP (2n x 2n+1 Bit Matrix)</text>
  <text x="655" y="396" class="box-sub">100 to 1,000+ Qubit Ideal &amp; Noisy Pauli Trajectories</text>

  <!-- Connectors L3 to L4 -->
  <line x1="180" y1="409" x2="180" y2="450" class="arrow-accent" />
  <line x1="480" y1="409" x2="480" y2="450" class="arrow-accent" />
  <line x1="780" y1="409" x2="780" y2="450" class="arrow" />

  <!-- Layer 4: Compute Accelerator Dispatch, Observables & Roofline Telemetry -->
  <text x="40" y="440" class="layer-title">Layer 4: Hardware Acceleration, In-Place Pauli Observables &amp; Roofline Bandwidth Profiler</text>
  <rect x="40" y="450" width="280" height="74" class="box box-backend" />
  <text x="55" y="475" class="box-text">Compute Accelerator Dispatch</text>
  <text x="55" y="493" class="box-sub">src/engine/accelerator.py, fusion.py</text>
  <text x="55" y="507" class="box-sub">NVIDIA CUDA | Apple Metal | C++ SIMD | NumPy</text>

  <rect x="340" y="450" width="280" height="74" class="box box-backend" />
  <text x="355" y="475" class="box-text">Observables &amp; Bipartite Entropy</text>
  <text x="355" y="493" class="box-sub">src/engine/observables.py, entanglement.py</text>
  <text x="355" y="507" class="box-sub">&lt;H_Ising&gt;, &lt;Z_0 Z_{n-1}&gt;, S(rho_A) via SVD/GF(2)</text>

  <rect x="640" y="450" width="280" height="74" class="box box-telemetry" />
  <text x="655" y="475" class="box-text">Roofline Bandwidth &amp; Energy Profiler</text>
  <text x="655" y="493" class="box-sub">src/profiler/telemetry.py, energy.py</text>
  <text x="655" y="507" class="box-sub">Solver-Aware GB/s, FLOPs/Byte, RAPL/TDP Joules</text>

  <!-- Connectors L4 to L5 -->
  <line x1="250" y1="524" x2="250" y2="562" class="arrow-accent" />
  <line x1="710" y1="524" x2="710" y2="562" class="arrow" />

  <!-- Layer 5: Metrics & Exporters -->
  <text x="40" y="552" class="layer-title">Layer 5: Dual-Mode Scoring, Academic Verification &amp; Multi-Format Reporting</text>
  <rect x="40" y="562" width="430" height="62" class="box box-export" />
  <text x="55" y="586" class="box-text">Dual-Mode Scorer &amp; Academic Verification Suite</text>
  <text x="55" y="605" class="box-sub">src/scorer/calculator.py (QSI, kGates/s, Effective GB/s, QV, EDP)</text>

  <rect x="490" y="562" width="430" height="62" class="box box-export" />
  <text x="505" y="586" class="box-text">Telemetry Exporters &amp; 300 DPI Chart Engine</text>
  <text x="505" y="605" class="box-sub">src/reporter/ (JSON Schema, GFM Markdown Reports, Matplotlib Plots)</text>
</svg>
