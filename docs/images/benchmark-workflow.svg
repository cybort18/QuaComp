<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #f0f6fc; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #8b949e; }
      .step-num { font-family: 'SFMono-Regular', Consolas, Menlo, monospace; font-size: 11px; font-weight: 700; fill: #58a6ff; }
      .node { rx: 6px; ry: 6px; stroke-width: 1.2px; }
      .node-normal { fill: #161b22; stroke: #30363d; }
      .node-decision { fill: #1c2128; stroke: #d29922; }
      .node-danger { fill: #2b1d1d; stroke: #f85149; }
      .node-accent { fill: #12283a; stroke: #58a6ff; }
      .node-success { fill: #132b1e; stroke: #3fb950; }
      .text-head { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #f0f6fc; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #8b949e; }
      .text-code { font-family: 'SFMono-Regular', Consolas, Menlo, monospace; font-size: 10px; fill: #79c0ff; }
      .flow { stroke: #58a6ff; stroke-width: 1.5; fill: none; marker-end: url(#wf-arrow); }
      .flow-branch { stroke: #d29922; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; marker-end: url(#wf-arrow-gold); }
      .flow-err { stroke: #f85149; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; marker-end: url(#wf-arrow-red); }
    </style>
    <marker id="wf-arrow" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#58a6ff" />
    </marker>
    <marker id="wf-arrow-gold" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#d29922" />
    </marker>
    <marker id="wf-arrow-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#f85149" />
    </marker>
  </defs>

  <rect width="960" height="620" class="bg" />

  <text x="40" y="42" class="title">Benchmark Execution Lifecycle</text>
  <text x="40" y="62" class="subtitle">Complete execution path from invocation to resource verification, benchmarking, scoring, and report generation</text>

  <!-- Step 1 -->
  <rect x="40" y="95" width="260" height="74" class="node node-normal" />
  <text x="55" y="117" class="step-num">STAGE 01: INGRESS</text>
  <text x="55" y="138" class="text-head">Parse CLI Parameters</text>
  <text x="55" y="155" class="text-body">Validate --qubits, --method, --shots</text>

  <line x1="300" y1="132" x2="350" y2="132" class="flow" />

  <!-- Step 2 (Decision: Pre-flight) -->
  <rect x="350" y="95" width="260" height="74" class="node node-decision" />
  <text x="365" y="117" class="step-num">STAGE 02: PRE-FLIGHT</text>
  <text x="365" y="138" class="text-head">Pre-Flight Memory Guard</text>
  <text x="365" y="155" class="text-body">Evaluate RAM &amp; VRAM vs. 85% safety limit</text>

  <!-- Branch from Step 2 to OOM Guard -->
  <line x1="480" y1="169" x2="480" y2="215" class="flow-err" />

  <!-- OOM Guard Box -->
  <rect x="350" y="215" width="260" height="60" class="node node-danger" />
  <text x="365" y="238" class="text-head" fill="#f85149">Resource Exceeded</text>
  <text x="365" y="258" class="text-body">Abort with memory notice or skip point</text>

  <!-- Step 2 to Step 3 -->
  <line x1="610" y1="132" x2="660" y2="132" class="flow" />

  <!-- Step 3 -->
  <rect x="660" y="95" width="260" height="74" class="node node-normal" />
  <text x="675" y="117" class="step-num">STAGE 03: WORKLOAD PREP</text>
  <text x="675" y="138" class="text-head">Circuit Compilation</text>
  <text x="675" y="155" class="text-body">Synthesize ansatz or parse OpenQASM AST</text>

  <!-- Step 3 to Step 4 -->
  <line x1="790" y1="169" x2="790" y2="310" class="flow" />

  <!-- Step 4 -->
  <rect x="660" y="310" width="260" height="74" class="node node-accent" />
  <text x="675" y="332" class="step-num">STAGE 04: BACKEND DISPATCH</text>
  <text x="675" y="353" class="text-head">Accelerator Resolution</text>
  <text x="675" y="370" class="text-body">Bind CUDA / Metal / C++ SIMD / NumPy</text>

  <line x1="660" y1="347" x2="610" y2="347" class="flow" />

  <!-- Step 5 (Benchmark Execution Loop) -->
  <rect x="350" y="310" width="260" height="88" class="node node-accent" />
  <text x="365" y="330" class="step-num">STAGE 05: BENCHMARK LOOP</text>
  <text x="365" y="350" class="text-head">Timed Execution Loop</text>
  <text x="365" y="367" class="text-body">Device sync before/after; measure N runs</text>
  <text x="365" y="384" class="text-code">Collect latency, gates/s, CPU %, Joules</text>

  <line x1="350" y1="354" x2="300" y2="354" class="flow" />

  <!-- Step 6 -->
  <rect x="40" y="310" width="260" height="88" class="node node-normal" />
  <text x="55" y="330" class="step-num">STAGE 06: STATISTICAL ANALYSIS</text>
  <text x="55" y="350" class="text-head">Metrics &amp; QSI Scoring</text>
  <text x="55" y="367" class="text-body">Calculate Mean, Median, Std, Fidelity,</text>
  <text x="55" y="384" class="text-body">Energy-Delay Product, Composite Score</text>

  <line x1="170" y1="398" x2="170" y2="465" class="flow" />

  <!-- Step 7 -->
  <rect x="40" y="465" width="410" height="85" class="node node-success" />
  <text x="55" y="487" class="step-num">STAGE 07: ARTIFACT EXPORT</text>
  <text x="55" y="508" class="text-head">Report Exporters &amp; Chart Generation</text>
  <text x="55" y="527" class="text-body">Output JSON schema (results/*.json), Markdown summary,</text>
  <text x="55" y="542" class="text-body">and Matplotlib charts (latency, memory, gate throughput)</text>

  <line x1="450" y1="507" x2="500" y2="507" class="flow" />

  <!-- Step 8 (Optional Comparison) -->
  <rect x="500" y="465" width="420" height="85" class="node node-normal" />
  <text x="515" y="487" class="step-num">OPTIONAL: BASELINE COMPARISON</text>
  <text x="515" y="508" class="text-head">Differential Benchmark Engine</text>
  <text x="515" y="527" class="text-body">Compare live metrics against reference baselines</text>
  <text x="515" y="542" class="text-code">--compare live vs example_apple_m3 / example_nvidia_h100</text>
</svg>
