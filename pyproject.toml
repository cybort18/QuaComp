[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quacomp"
version = "1.5.0"
description = "Quantum Computer Simulation Benchmark — A modular Python utility designed to measure, stress-test, and profile quantum computer simulation limits on local hardware."
readme = "README.md"
authors = [
    { name = "cybort18" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["quantum", "simulation", "benchmark", "qiskit", "hardware", "mps", "nisq"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "psutil>=5.9.0",
    "pytest>=7.0.0",
    "qiskit>=1.0.0",
    "qiskit-aer>=0.14.0",
    "rich>=12.0.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
]

[project.scripts]
quacomp = "cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "cli*"]
