name: QuaComp CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install and configure macOS OpenMP (libomp)
        if: runner.os == 'macOS'
        run: |
          brew install libomp
          LIBOMP_DIR="$(brew --prefix libomp)/lib"
          echo "DYLD_LIBRARY_PATH=$LIBOMP_DIR:$DYLD_LIBRARY_PATH" >> $GITHUB_ENV
          echo "DYLD_FALLBACK_LIBRARY_PATH=$LIBOMP_DIR:$DYLD_FALLBACK_LIBRARY_PATH" >> $GITHUB_ENV
          sudo mkdir -p /usr/local/lib
          sudo cp "$LIBOMP_DIR/libomp.dylib" /usr/local/lib/ 2>/dev/null || true

      - name: Install dependencies and QuaComp in editable mode
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run unit tests with Pytest
        run: |
          python -m pytest -v -rA --tb=short

      - name: Verify CLI command execution
        run: |
          python -m cli --help
          python -m cli --quick
